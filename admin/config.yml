# Konfiguration des Verwaltungsbereichs (/admin)
# Hier wird festgelegt, welche Felder Milos im Panel sieht.
# Änderungen an diesem Ablauf nur mit Stefan absprechen.

backend:
  name: github
  repo: milosfender/mjguitars-sajt
  branch: main
  base_url: https://sveltia-cms-auth.9kwzbgpwy2.workers.dev
media_folder: "images/uploads"
public_folder: "/images/uploads"

# Fotos werden beim Hochladen automatisch verkleinert und als WebP gespeichert.
media_libraries:
  all:
    transformations:
      raster_image:
        format: webp
        quality: 82
        width: 1600
        height: 1600

publish_mode: simple

collections:
  - name: "gitarren"
    label: "Gitarren"
    files:
      - name: "gitarren-liste"
        label: "Gitarren-Liste"
        file: "data/guitars.json"
        fields:
          - label: "Gitarren"
            name: "guitars"
            widget: "list"
            label_singular: "Gitarre"
            summary: "{{fields.brand}} {{fields.model}} ({{fields.year}}) – {{fields.price}} €"
            fields:
              - { label: "Marke", name: "brand", widget: "string" }
              - { label: "Modell", name: "model", widget: "string" }
              - label: "Kategorie"
                name: "category"
                widget: "select"
                options:
                  - "E-Gitarre"
                  - "Westerngitarre"
                  - "Klassische Gitarre"
                  - "E-Bass"
                  - "Akustikbass"
                  - "Verstärker"
                  - "Effektpedal"
                  - "Sonstiges"
              - label: "Zustand"
                name: "condition"
                widget: "select"
                options:
                  - "Wie neu"
                  - "Gebraucht – sehr gut"
                  - "Gebraucht – gut"
                  - "Gebraucht – Gebrauchsspuren"
              - { label: "Baujahr", name: "year", widget: "number", value_type: "int", min: 1900, max: 2030 }
              - { label: "Preis in Euro", name: "price", widget: "number", value_type: "int", min: 0 }
              - { label: "Beschreibung (1–3 Sätze)", name: "description", widget: "text" }
              - label: "Fotos (10 bis 20 empfohlen, das erste Foto ist das Titelbild)"
                name: "photos"
                widget: "list"
                field: { label: "Foto", name: "photo", widget: "image" }
              - label: "Verkauft"
                name: "sold"
                widget: "boolean"
                default: false
                hint: "Einschalten, wenn die Gitarre verkauft ist. Sie bleibt dann mit Badge sichtbar."

  - name: "bewertungen"
    label: "Bewertungen"
    files:
      - name: "bewertungen-liste"
        label: "Google-Bewertungen"
        file: "data/reviews.json"
        fields:
          - { label: "Durchschnitt auf Google (z.B. 4.9)", name: "average", widget: "number", value_type: "float", min: 1, max: 5, step: 0.1, required: false }
          - { label: "Anzahl Bewertungen auf Google", name: "total", widget: "number", value_type: "int", min: 0, required: false }
          - label: "Bewertungen"
            name: "reviews"
            widget: "list"
            label_singular: "Bewertung"
            summary: "{{fields.name}} – {{fields.rating}} ★"
            required: false
            fields:
              - { label: "Name (wie auf Google)", name: "name", widget: "string" }
              - { label: "Sterne (1–5)", name: "rating", widget: "number", value_type: "int", min: 1, max: 5, default: 5 }
              - { label: "Datum (z.B. Oktober 2026)", name: "date", widget: "string", required: false }
              - { label: "Text der Bewertung", name: "text", widget: "text" }
